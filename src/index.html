<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureLens Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2, h3 {
            color: #333;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .mode-selector {
            display: flex;
            margin-bottom: 20px;
        }
        .mode-selector button {
            flex: 1;
            margin: 0 5px;
            opacity: 0.7;
        }
        .mode-selector button.active {
            opacity: 1;
            font-weight: bold;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .login-form input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .login-form button {
            align-self: flex-start;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .question-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        /* Fixed height header section */
        .question-header {
            height: 80px;
        }
        
        /* Fixed height for question text with scrolling */
        .question-text-container {
            height: 120px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .question-text {
            font-size: 1.2em;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px 0;
        }
        
        /* Fixed position for response options */
        .response-section {
            height: 400px;  /* Increased height for more space */
            position: relative;
        }
        
        .response-options {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            position: absolute;
            top: 0;
        }
        
        .response-btn {
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            text-align: left;
            height: 50px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
        }
        
        .response-btn.selected {
            background-color: #004c8c;
            font-weight: bold;
            border: 2px solid #002b50;
        }
        
        /* Fixed position for "don't understand" option */
        .dont-understand-container {
            position: absolute;
            top: 280px;  /* Position it at a fixed distance from the top instead of from bottom */
            left: 0;
            display: flex;
            align-items: center;
            height: 30px;
            width: 100%;
            max-width: 400px;
        }
        
        .dont-understand-container input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.3);
        }
        
        .dont-understand-container label {
            font-size: 1rem;
            cursor: pointer;
        }
        
        /* Fixed position for navigation buttons */
        .navigation-buttons {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            height: 50px;
        }
        
        #prev-btn {
            background-color: #6c757d;
            width: 100px;
        }
        
        #prev-btn:hover {
            background-color: #5a6268;
        }
        
        #next-btn {
            margin-left: auto;
            width: 100px;
        }
        
        .survey-complete {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>FutureLens Survey</h1>
        <div class="mode-selector">
            <button id="identifiable-mode-btn" class="active">Identifiable Mode</button>
            <button id="anonymous-mode-btn">Anonymous Mode</button>
        </div>
        <form id="login-form" class="login-form">
            <input type="text" id="code-input" placeholder="Enter your passcode" required>
            <button type="submit">Login</button>
        </form>
        <div id="message" class="message"></div>
    </div>
    
    <div id="survey-container" style="display: none;"></div>
    
    <!-- Add our JavaScript files as modules -->
    <script type="module" src="survey.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="supabase.js"></script>
    <script type="module">
        import { fetchSurvey, initSurvey } from './survey.js';
        import { handleLogin } from './auth.js';
        
        const loginForm = document.getElementById('login-form');
        const codeInput = document.getElementById('code-input');
        const messageDiv = document.getElementById('message');
        const identifiableModeBtn = document.getElementById('identifiable-mode-btn');
        const anonymousModeBtn = document.getElementById('anonymous-mode-btn');
        const surveyContainer = document.getElementById('survey-container');
        
        let currentMode = 'identifiable'; // Default mode
        
        // Handle mode selection
        anonymousModeBtn.addEventListener('click', () => {
            currentMode = 'anonymous';
            anonymousModeBtn.classList.add('active');
            identifiableModeBtn.classList.remove('active');
            codeInput.placeholder = 'Enter cohort code';
            console.log('Switched to anonymous mode');
        });

        identifiableModeBtn.addEventListener('click', () => {
            currentMode = 'identifiable';
            identifiableModeBtn.classList.add('active');
            anonymousModeBtn.classList.remove('active');
            codeInput.placeholder = 'Enter your passcode';
            console.log('Switched to identifiable mode');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = codeInput.value;
            
            console.log('Attempting login with code:', code, 'in mode:', currentMode);
            messageDiv.textContent = 'Logging in...';
            messageDiv.className = '';

            try {
                const result = await handleLogin(code, currentMode);
                console.log('Login result:', result);
                
                if (result.success) {
                    messageDiv.textContent = 'Login successful!';
                    messageDiv.className = 'success-message';
                    
                    // Hide login container and show survey
                    document.getElementById('login-container').style.display = 'none';
                    surveyContainer.style.display = 'block';
                    
                    // Fetch and initialize survey
                    try {
                        // For now, use the test survey with ID 1
                        const survey = await fetchSurvey('1');
                        if (!survey) {
                            throw new Error('Survey not found');
                        }
                        initSurvey(survey);
                    } catch (error) {
                        console.error('Error loading survey:', error);
                        messageDiv.textContent = 'Error loading survey. Please try again.';
                        messageDiv.className = 'error-message';
                        document.getElementById('login-container').style.display = 'block';
                        surveyContainer.style.display = 'none';
                    }
                } else {
                    messageDiv.textContent = result.error || 'Login failed';
                    messageDiv.className = 'error-message';
                    console.error('Login failed:', result.error);
                }
            } catch (error) {
                messageDiv.textContent = 'An unexpected error occurred. Please try again.';
                messageDiv.className = 'error-message';
                console.error('Login error:', error);
            }
        });

        // Initial setup logging
        console.log('Login page initialized');
        console.log('Current mode:', currentMode);
    </script>
</body>
</html>
